<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kickoff Cinema — Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/api.js" defer></script>
  <script src="/js/layout.js" defer></script>
  <script src="/js/auth.js" defer></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <div class="panel auth-card">
      <h1>Sign up</h1>
      <p class="muted">Start watching for free. Upgrade to Premium any time.</p>
      <div id="form-message"></div>

      <form id="auth-form" data-mode="register">
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" autocomplete="name" maxlength="100" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 minlength="8" required>
        </div>
        <div class="field">
          <label for="password_confirm">Repeat password</label>
          <input id="password_confirm" name="password_confirm" type="password"
                 autocomplete="new-password" minlength="8" required>
        </div>
        <button class="btn" type="submit">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </main>
</body>
</html>
